# The kernel's own gate: every push and pull request runs the tests and the strict rubric.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: tests
        run: python -m unittest discover -s tests -t .
      - name: lint --strict
        run: python -m holon --home "$(mktemp -d)" lint --strict
