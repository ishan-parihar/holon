# Holon driver for Claude Code headless (`claude -p`). Observe stages run in plan mode (no edits);
# execute gets edit permissions. The prompt carries the identity card and the stage brief.
name = "claude-code"
command = "claude -p {briefing} {read_only}{act_args} --output-format json"
cwd = "{workdir}"
timeout_s = 3600
result = "stdout-json"   # result.json when written; else the JSON in Claude's reply
read_only = "--permission-mode plan"
act_args = "--permission-mode acceptEdits"
read_only_enforced = true
