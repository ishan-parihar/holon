
# ── Holon (agentic OS) employees: appended by adapters/zeroclaw/install.py ──
# Two agent aliases per scope (`holon scope`): holon-<scope>-observe and holon-<scope>-act, each with its
# own risk profile. Provider, roots, commands and the skills directory are filled in by install.py.

@PROVIDER_BLOCK@
[runtime_profiles.holon]
# Planning and execution need room to explore; the ZeroClaw default stops a turn after 10 tool calls.
max_tool_iterations = 40

[skill_bundles.holon]
# Holon's skills library, exported (rendered for this instance) by `holon skill export`.
directory = "@SKILLS_DIR@"

[[mcp.servers]]
# The organization as native tools (holon_whoami, holon_submit, holon_memory_search, …). ZeroClaw
# spawns it per session with the agent's environment, so the run token authenticates every call.
name = "holon"
transport = "stdio"
command = "@HOLON_BIN@"
args = ["mcp"]
tool_timeout_secs = 120

[mcp_bundles.holon]
servers = ["holon"]

@SCOPES@# ── end Holon ──
