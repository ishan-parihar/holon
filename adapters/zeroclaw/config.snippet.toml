
# ── Holon (agentic OS) employees: appended by adapters/zeroclaw/install.py ──
# Two agent aliases, one per posture; provider, allowed roots and the skills directory are filled in.

@PROVIDER_BLOCK@
[runtime_profiles.holon]
# Planning and execution need room to explore; the ZeroClaw default stops a turn after 10 tool calls.
max_tool_iterations = 40

[skill_bundles.holon]
# Holon's skills library, exported (rendered for this instance) by `holon skill export`.
directory = "@SKILLS_DIR@"

[[mcp.servers]]
# The organization as native tools (holon_whoami, holon_submit, holon_memory_search, …). ZeroClaw
# spawns it per session with the agent's environment, so the run token authenticates every call.
name = "holon"
transport = "stdio"
command = "@HOLON_BIN@"
args = ["mcp"]
tool_timeout_secs = 120

[mcp_bundles.holon]
servers = ["holon"]

[risk_profiles.holon-observer]
# research, shape, plan, approve, verify, retro: look, never touch. No write tools; the shell is
# limited to commands that cannot write (no git, no sqlite3, no interpreters).
level = "full"
block_high_risk_commands = true
auto_approve = ["*"]
excluded_tools = ["file_write", "file_edit", "file_upload", "file_upload_bundle", "file_download", "skill_manage"]
allowed_roots = [@ALLOWED_ROOTS@]
forbidden_paths = [@FORBIDDEN_PATHS@]
allowed_commands = ["holon", "ls", "cat", "grep", "find", "head", "tail", "wc", "stat", "du", "df", "date", "pwd", "sort", "uniq", "cut", "tr", "jq", "uname", "uptime", "free", "hostname"]

[risk_profiles.holon-worker]
# execute: does the approved plan. Same roots and forbidden paths; broader commands.
# skill_manage is excluded: an employee's learning belongs in Holon memory, not harness-local skills.
level = "full"
block_high_risk_commands = true
auto_approve = ["*"]
excluded_tools = ["skill_manage"]
allowed_roots = [@ALLOWED_ROOTS@]
forbidden_paths = [@FORBIDDEN_PATHS@]
allowed_commands = ["holon", "git", "npm", "cargo", "ls", "cat", "grep", "find", "echo", "pwd", "wc", "head", "tail", "date", "df", "du", "uname", "uptime", "hostname", "python", "python3", "pip", "node", "free", "timeout", "sort", "awk", "sleep", "mkdir", "bash", "sh", "env", "cut", "tr", "uniq", "tee", "cp", "mv", "ln", "sed", "jq", "stat", "touch", "rm"]

[agents.holon-observe]
model_provider = "@MODEL_PROVIDER@"
runtime_profile = "holon"
mcp_bundles = ["holon"]
risk_profile = "holon-observer"
skill_bundles = ["holon"]
enabled = true

[agents.holon-act]
model_provider = "@MODEL_PROVIDER@"
runtime_profile = "holon"
mcp_bundles = ["holon"]
risk_profile = "holon-worker"
skill_bundles = ["holon"]
enabled = true
# ── end Holon ──
