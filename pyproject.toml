[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holon"
version = "0.1.0"
description = "Harness-agnostic agentic operating system kernel (stdlib + sqlite3 only)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
holon = "holon.cli:main"

[tool.setuptools.packages.find]
include = ["holon*"]

[tool.setuptools.package-data]
"holon.migrations" = ["work/*.sql", "memory/*.sql"]
"holon.execution" = ["templates/*.md", "drivers/*.toml"]
