[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holon"
version = "0.1.0"
description = "Harness-agnostic agentic operating system kernel (stdlib + sqlite3 only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }
authors = [{ name = "Ishan Parihar" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Repository = "https://github.com/ishan-parihar/holon"
Issues = "https://github.com/ishan-parihar/holon/issues"

[project.scripts]
holon = "holon.cli:main"

[tool.setuptools.packages.find]
include = ["holon*"]

[tool.setuptools.package-data]
"holon.migrations" = ["work/*.sql", "memory/*.sql"]
"holon.execution" = ["drivers/*.toml"]
"holon.bylaws" = ["*.toml"]
"holon" = ["skills/*/*.md", "skills/*/*/*.md"]
