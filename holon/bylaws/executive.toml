# The executive office: the same bylaws one level up. It does not execute; its execution is
# delegation to departments (decompositions), so no executor slot is required.
name = "executive"
version = 1
description = "CEO, strategy, audit and charter: the organization's own head office"
delegates_execution = true

[[slots]]
name = "ceo"
roles = ["head", "planner"]

[[slots]]
name = "strategy"
roles = ["researcher"]

[[slots]]
name = "audit"
roles = ["verifier"]

[[slots]]
name = "charter"
roles = ["steward"]
